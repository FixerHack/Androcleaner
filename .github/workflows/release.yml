name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          ANDROCLEANER_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROCLEANER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROCLEANER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROCLEANER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testStandardDebugUnitTest assembleStandardRelease assembleFullRelease
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "Androcleaner-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "Androcleaner-Full-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: Androcleaner-*.apk
          body_path: scripts/release-notes.md
          generate_release_notes: true
